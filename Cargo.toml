[workspace]
resolver = "2"
members = [
    "crates/rox-common",
    "crates/rox-core-host",
    "crates/rox-runner",
    "crates/rox-library",
    "crates/rox-metadata",
    "apps/launcher/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rox-common = { path = "crates/rox-common" }
rox-core-host = { path = "crates/rox-core-host" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
libloading = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
