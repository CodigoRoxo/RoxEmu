<title>ROXemu Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tela única de console. Modo Console = carrossel de capas central; modo Biblioteca = sidebar + grade + painel de detalhes. Tema escuro único (roxo/rosa) por escolha. */
:root{
  color-scheme:dark;
  --void:#0b0614;
  --plum:#170c27;
  --plum-2:#22123a;
  --rox:#8b5cf6;
  --pink:#ec4899;
  --ink:#f4effc;
  --mist:#b9a9d6;
  --dim:#7d6d9c;
  --line:rgba(185,169,214,.16);
  --glass:rgba(34,18,58,.55);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --g1:#7c3aed; --g2:#ec4899;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:8px}

.app{position:relative;height:100%;display:flex;flex-direction:column;isolation:isolate;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 120%,#3a0f3d 0%,transparent 60%),linear-gradient(160deg,#120922 0%,#0b0614 55%,#1a0a24 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55;transition:background-color 1.2s ease}
.blob.a{width:55vw;height:55vw;left:-12vw;top:-18vw;background-color:var(--g1);animation:drift 22s ease-in-out infinite alternate}
.blob.b{width:48vw;height:48vw;right:-14vw;bottom:-20vw;background-color:var(--g2);animation:drift 26s ease-in-out infinite alternate-reverse}
#dust{position:absolute;inset:0;width:100%;height:100%;opacity:.7}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.08)}}

/* ---------- topo ---------- */
.top{display:flex;align-items:center;gap:20px;padding-block:18px 10px;min-width:0}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.5px;white-space:nowrap}
.logo b{background:linear-gradient(90deg,var(--rox),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding:4px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mist);transition:background .2s,color .2s}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.chip.on{background:var(--ink);color:#2a1245}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.status{display:flex;align-items:center;gap:16px;color:var(--mist);font-size:13px;white-space:nowrap}
.status .tro{color:#f5c84b;font-weight:700}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--rox),var(--pink));display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--mist)}
.seg button.on{background:linear-gradient(90deg,var(--rox),var(--pink));color:#fff}
.batt{display:inline-flex;align-items:center;gap:5px}
.batt i{display:inline-block;width:20px;height:10px;border:1.5px solid var(--mist);border-radius:3px;position:relative}
.batt i::after{content:"";position:absolute;inset:1px;right:30%;background:#7ee2a8;border-radius:1px}

/* ---------- capas (geradas, fictícias) ---------- */
.cover{position:relative;overflow:hidden;border-radius:6px;background:linear-gradient(155deg,var(--c1) 0%,color-mix(in srgb,var(--c1) 55%,#000) 100%);box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:13%;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6% 0}
.cover .spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-display);font-size:clamp(6px,.9cqw + 4px,13px);letter-spacing:1px;color:rgba(255,255,255,.85)}
.cover .art{position:absolute;left:13%;right:0;top:0;bottom:0;container-type:inline-size}
.cover .ct{position:absolute;left:18%;right:6%;bottom:7%;font-family:var(--f-display);font-weight:700;line-height:1.02;color:#fff;font-size:clamp(8px,11cqw,34px);text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.cover .rg{position:absolute;right:5%;top:5%;font-family:var(--f-mono);font-size:clamp(6px,4.2cqw,11px);background:rgba(0,0,0,.45);color:#fff;padding:2px 6px;border-radius:4px}
.cover{container-type:inline-size}
.m{position:absolute}
.m-sun{width:64%;aspect-ratio:1;left:18%;top:12%;border-radius:50%;background:linear-gradient(var(--c2),color-mix(in srgb,var(--c2) 40%,#ff0));
  -webkit-mask:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 63%,transparent 63% 68%,#000 68% 74%,transparent 74% 80%,#000 80% 85%,transparent 85%);
          mask:linear-gradient(#000 52%,transparent 52% 56%,#000 56% 63%,transparent 63% 68%,#000 68% 74%,transparent 74% 80%,#000 80% 85%,transparent 85%)}
.m-moon{width:56%;aspect-ratio:1;left:30%;top:10%;border-radius:50%;background:var(--c2)}
.m-moon::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;left:-26%;top:-10%;background:var(--c1)}
.m-stripes{inset:0;background:repeating-linear-gradient(-55deg,transparent 0 14%,color-mix(in srgb,var(--c2) 85%,transparent) 14% 20%)}
.m-ring{width:62%;aspect-ratio:1;left:20%;top:10%;border-radius:50%;border:clamp(4px,9cqw,40px) solid var(--c2);box-shadow:0 0 40px var(--c2)}
.m-star{width:60%;aspect-ratio:1;left:22%;top:10%;background:conic-gradient(from 20deg,var(--c2),#fff,var(--c2));clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.m-grid{left:-20%;right:-20%;bottom:-10%;height:62%;transform:perspective(160px) rotateX(55deg);transform-origin:bottom;
  background:repeating-linear-gradient(90deg,var(--c2) 0 2px,transparent 2px 12%),repeating-linear-gradient(0deg,var(--c2) 0 2px,transparent 2px 14%);opacity:.85}

/* ---------- modo console ---------- */
.console{flex:1;display:flex;flex-direction:column;min-height:0}
.stage{position:relative;flex:1;min-height:180px;overflow:hidden;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.slot{position:absolute;left:0;top:0;transform-origin:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .35s;cursor:pointer;will-change:transform}
.slot .cover{width:100%;height:100%}
.slot:not(.sel){filter:brightness(.62) saturate(.85)}
.slot:not(.sel):hover{filter:brightness(.85)}
.slot.sel .cover{outline:3px solid #fff;outline-offset:4px;box-shadow:0 0 0 10px rgba(236,72,153,.15),0 30px 70px -10px color-mix(in srgb,var(--g2) 60%,transparent)}
.info{text-align:center;padding-block:14px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.info h1{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.2vw,34px);margin:0;letter-spacing:-.5px;text-wrap:balance;display:flex;align-items:center;gap:12px;justify-content:center}
.fav{width:28px;height:28px;color:var(--mist);flex:none}
.fav.on{color:#f5c84b}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{padding:5px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mist);backdrop-filter:blur(8px)}
.tag.mono{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.tag.fmt{color:#f0abfc;border-color:rgba(240,171,252,.3)}
.trophy{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mist);font-family:var(--f-mono)}
.trophy .bar{width:min(220px,40vw);height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.trophy .bar i{display:block;height:100%;background:linear-gradient(90deg,#f5c84b,var(--pink));border-radius:9px;transition:width .5s}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:transform .15s,background .2s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn.play{background:linear-gradient(90deg,var(--rox),var(--pink));border-color:transparent;color:#fff;box-shadow:0 10px 30px -8px rgba(236,72,153,.6)}
.btn svg{width:16px;height:16px}

.hints{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mist)}
.hints div{display:flex;gap:18px;flex-wrap:wrap}
.k{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;border:1.5px solid currentColor;font-size:10px;font-weight:800;margin-right:6px}
.k.a{color:#7ee2a8}.k.b{color:#ff7a90}.k.x{color:#7fb2ff}.k.y{color:#f5c84b}
.hints span{display:inline-flex;align-items:center;color:var(--ink)}

/* ---------- modo biblioteca ---------- */
.library{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:18px;min-height:0;padding-bottom:16px}
.side{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--mist);text-align:left}
.nav svg{width:18px;height:18px}
.nav.on{background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(236,72,153,.18));color:#fff}
.nav .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:9px}
.side h4{margin:14px 12px 4px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.sys{display:flex;align-items:center;gap:10px;padding:7px 12px;color:var(--mist);font-size:13px}
.sys i{width:9px;height:9px;border-radius:50%}
.lmain{min-width:0;overflow:auto;padding-right:4px}
.lhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.lhead h2{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700}
.lhead .cnt{color:var(--dim);font-size:13px}
.search{flex:1;min-width:160px;max-width:320px;margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--mist)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:13px}
.search svg{width:16px;height:16px}
.group{margin-bottom:22px}
.group h3{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 10px;color:var(--mist);font-weight:700}
.group h3 code{font-family:var(--f-mono);font-size:11px;color:var(--dim);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.card{text-align:left;padding:8px;border-radius:12px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .2s}
.card:hover{background:rgba(255,255,255,.05);transform:translateY(-2px)}
.card.sel{background:rgba(139,92,246,.16);border-color:rgba(236,72,153,.55)}
.card .cover{width:100%;aspect-ratio:1}
.card b{display:block;margin-top:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);margin-top:2px}
.card small i{width:6px;height:6px;border-radius:50%;background:#7ee2a8}
.card small i.never{background:var(--dim)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;overflow:auto;backdrop-filter:blur(14px);min-width:0}
.banner{position:relative;height:150px;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,var(--c1),color-mix(in srgb,var(--c2) 70%,var(--c1)))}
.banner .cover{position:absolute;left:14px;bottom:14px;width:96px;height:96px}
.banner .m{opacity:.55}
.panel h2{font-family:var(--f-display);font-size:19px;margin:14px 0 8px;font-weight:700}
.panel .tags{justify-content:flex-start;margin-bottom:14px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.prow .btn{justify-content:center;padding:11px 14px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;margin:0 0 14px;font-size:13px}
dt{color:var(--dim)}
dd{margin:0;overflow-wrap:anywhere}
dd.path{font-family:var(--f-mono);font-size:11.5px;color:#c4b5fd}
.sub{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:6px 0 8px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mini button{padding:9px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.mini button:hover{background:rgba(255,255,255,.11)}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.state{border-radius:8px;overflow:hidden;border:1px solid var(--line);font-size:10.5px;color:var(--mist)}
.state div{aspect-ratio:4/3;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.75}
.state p{margin:0;padding:4px 6px;font-family:var(--f-mono)}

/* ---------- overlay de início ---------- */
.launch{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(11,6,20,.88);backdrop-filter:blur(18px);animation:fade .3s}
.launch .box{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:24px}
.launch .cover{width:180px;height:180px;animation:pulse 1.6s ease-in-out infinite}
.launch h3{font-family:var(--f-display);margin:0;font-size:20px}
.launch p{margin:0;color:var(--mist);max-width:36ch;line-height:1.5}
.launch .bar{width:220px;height:4px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.launch .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rox),var(--pink));animation:load 2s ease forwards}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes load{to{width:100%}}

@media (max-width:1100px){.library{grid-template-columns:minmax(0,1fr) 300px}.side{display:none}}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .top{flex-wrap:wrap;gap:10px}
  .chips{order:3;flex-basis:100%}
  .status .hide-s{display:none}
  .stage{flex:none;height:300px}
  .library{grid-template-columns:minmax(0,1fr)}
  .lmain{overflow:visible}
  .hints .r{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="bg" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><canvas id="dust"></canvas></div>

  <header class="top">
    <div class="logo">ROX<b>emu</b></div>
    <nav class="chips" id="chips" aria-label="Categorias"></nav>
    <div class="status">
      <div class="seg" role="tablist" aria-label="Modo de exibição">
        <button id="mConsole" class="on" role="tab">Console</button>
        <button id="mLib" role="tab">Biblioteca</button>
      </div>
      <span class="tro hide-s">🏆 1.240</span>
      <span class="batt hide-s"><i></i>70%</span>
      <span id="clock">21:40</span>
      <div class="av" title="Perfil">R</div>
    </div>
  </header>

  <!-- modo console -->
  <section class="console" id="console">
    <div class="stage" id="stage"></div>
    <div class="info">
      <h1><svg class="fav" id="fav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg><span id="title">—</span></h1>
      <div class="tags" id="tags"></div>
      <div class="trophy"><span>🏆</span><div class="bar"><i id="tbar"></i></div><span id="tnum">0 / 0</span></div>
      <div class="actions">
        <button class="btn play" id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>Jogar</button>
        <button class="btn" id="resume">Continuar do save</button>
        <button class="btn" id="details">Detalhes</button>
      </div>
    </div>
  </section>

  <!-- modo biblioteca -->
  <section class="library" id="library" hidden>
    <aside class="side">
      <button class="nav on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>Biblioteca<span class="n" id="navN">12</span></button>
      <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-2.7-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 15.4H3a2 2 0 110-4h.1a1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009.6 4V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1.3z"/></svg>Configurações</button>
      <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>Troféus</button>
      <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Logs</button>
      <h4>Consoles</h4>
      <div class="sys"><i style="background:#a78bfa"></i>PlayStation</div>
      <div class="sys"><i style="background:#f472b6"></i>Super Nintendo</div>
      <div class="sys"><i style="background:#60a5fa"></i>Game Boy Advance</div>
    </aside>
    <div class="lmain">
      <div class="lhead">
        <h2>Biblioteca</h2><span class="cnt" id="lcnt"></span>
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Buscar por nome ou serial" aria-label="Buscar"></label>
      </div>
      <div id="groups"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </section>

  <footer class="hints">
    <div><span><b class="k a">A</b>Jogar</span><span><b class="k y">Y</b>Detalhes</span><span><b class="k x">X</b>Configurações</span><span><b class="k b">B</b>Favoritar</span></div>
    <div class="r"><span><b class="k">LB</b><b class="k">RB</b>Categoria</span><span><b class="k">≡</b>Ordenar: título</span><span>← → ou controle para navegar</span></div>
  </footer>
</div>

<script>
const SYS={PS1:{name:"PlayStation",core:"SwanStation",dot:"#a78bfa"},SNES:{name:"Super Nintendo",core:"Snes9x",dot:"#f472b6"},GBA:{name:"Game Boy Advance",core:"mGBA",dot:"#60a5fa"}};
// Jogos fictícios só para o protótipo. No ROXemu real entram suas capas de verdade.
const G=[
 {t:"Neon Drift",s:"PS1",r:"NTSC-U",id:"SLUS-01482",d:1,fmt:"BIN/CUE · 3 faixas",size:"612 MB",h:"12h 40min",last:"Ontem",tr:[8,24],c1:"#3b1a7a",c2:"#ff4fa3",m:"sun",fav:true,file:"Neon Drift (USA).cue"},

const CATS=[["Todos",()=>true],["Jogados recentemente",g=>/Hoje|Ontem|dias/.test(g.last)],["Favoritos",g=>g.fav],["PlayStation",g=>g.s==="PS1"],["Super Nintendo",g=>g.s==="SNES"],["Game Boy Advance",g=>g.s==="GBA"],["Multi-disco",g=>g.d>1],["Japão",g=>g.r==="NTSC-J"]];
let cat=0,list=G.slice(),sel=0,libSel=G[0],mode="console";
const $=id=>document.getElementById(id);

function cover(g){
  return `<div class="cover" style="--c1:${g.c1};--c2:${g.c2}"><div class="art"><div class="m m-${g.m}"></div></div><div class="spine"><span>ROX</span><span>${g.s}</span></div><span class="rg">${g.r}</span><div class="ct">${g.t}</div></div>`;
}
function tagsHTML(g){
  const disc=g.d>1?`${g.d} discos`:g.d===1?"1 disco":"Cartucho";
  return `<span class="tag">${SYS[g.s].name}</span><span class="tag">${g.r}</span><span class="tag mono">${g.id}</span><span class="tag">${disc}</span><span class="tag fmt">${g.fmt}</span><span class="tag">⏱ ${g.h}</span><span class="tag">${g.last}</span>`;
}

/* chips */
function renderChips(){
  $("chips").innerHTML=CATS.map((c,i)=>`<button class="chip${i===cat?" on":""}" data-i="${i}">${c[0]}${i===0?`<span class="n">${G.length}</span>`:""}</button>`).join("");
}
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)setCat(+b.dataset.i)});
function setCat(i){
  cat=(i+CATS.length)%CATS.length;list=G.filter(CATS[cat][1]);if(!list.length)list=G.slice();sel=0;
  renderChips();buildStage();renderLib();
}

/* carrossel */
let slots=[];
function buildStage(){
  $("stage").innerHTML=list.map((g,i)=>`<div class="slot" data-i="${i}" role="button" aria-label="${g.t}">${cover(g)}</div>`).join("");
  slots=[...$("stage").children];
  slots.forEach(s=>s.addEventListener("click",()=>{const i=+s.dataset.i;i===sel?launch(list[sel]):select(i)}));
  select(0,true);
}
function layout(){
  const st=$("stage"),W=st.clientWidth,H=st.clientHeight;
  const B=Math.max(140,Math.min(H*.9,W*.46,380)),S=B*.66,gap=B*.08,cx=W*.5;
  slots.forEach((el,i)=>{
    const d=i-sel;let size=S,x,op=1;
    if(d===0){size=B;x=cx}
    else if(d>0){x=cx+B/2+gap+(d-1)*(S+gap*.6)+S/2}
    else{x=cx-B/2-gap-(-d-1)*(S+gap*.6)-S/2;op=d===-1?.45:0}
    if(x-S/2>W||x+S/2<0)op=0;
    el.style.width=el.style.height=B+"px";
    el.style.transform=`translate(${x-B/2}px,${(H-B)/2}px) scale(${size/B})`;
    el.style.opacity=op;el.style.zIndex=100-Math.abs(d);
    el.classList.toggle("sel",d===0);el.tabIndex=d===0?0:-1;
  });
}
function select(i,instant){
  sel=Math.max(0,Math.min(list.length-1,i));const g=list[sel];
  layout();
  $("title").textContent=g.t;$("tags").innerHTML=tagsHTML(g);
  $("tnum").textContent=`${g.tr[0]} / ${g.tr[1]}`;$("tbar").style.width=(g.tr[0]/g.tr[1]*100)+"%";
  $("fav").classList.toggle("on",g.fav);
  $("resume").hidden=g.h==="—";
  tint(g);
}
function tint(g){
  const r=document.documentElement.style;
  r.setProperty("--g1",`color-mix(in srgb,${g.c1} 50%,#7c3aed)`);
  r.setProperty("--g2",`color-mix(in srgb,${g.c2} 45%,#db2777)`);
  document.querySelector(".blob.a").style.backgroundColor=`color-mix(in srgb,${g.c1} 45%,#7c3aed)`;
  document.querySelector(".blob.b").style.backgroundColor=`color-mix(in srgb,${g.c2} 40%,#db2777)`;
}
$("play").onclick=()=>launch(list[sel]);
$("resume").onclick=()=>launch(list[sel],true);
$("details").onclick=()=>{libSel=list[sel];setMode("biblioteca")};
$("fav").onclick=()=>{list[sel].fav=!list[sel].fav;select(sel)};

/* biblioteca */
function renderLib(){
  const q=$("q").value.trim().toLowerCase();
  const items=list.filter(g=>!q||g.t.toLowerCase().includes(q)||g.id.toLowerCase().includes(q));
  $("lcnt").textContent=`${items.length} jogo${items.length===1?"":"s"}`;
  const by={};items.forEach(g=>(by[g.s]??=[]).push(g));
  $("groups").innerHTML=Object.keys(by).map(s=>`<div class="group"><h3><i style="width:8px;height:8px;border-radius:50%;background:${SYS[s].dot};display:inline-block"></i>${SYS[s].name} <code>D:\\Jogos\\${s}</code></h3><div class="grid">${by[s].map(g=>`<button class="card${g===libSel?" sel":""}" data-t="${g.t}">${cover(g)}<b>${g.t}</b><small><i class="${g.h==="—"?"never":""}"></i>${g.id}</small></button>`).join("")}</div></div>`).join("")||`<p style="color:var(--mist)">Nenhum jogo encontrado para “${q}”.</p>`;
  if(!items.includes(libSel)&&items.length)libSel=items[0];
  renderPanel();
}
$("groups").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;libSel=G.find(g=>g.t===c.dataset.t);renderLib()});
$("groups").addEventListener("dblclick",e=>{const c=e.target.closest(".card");if(c)launch(G.find(g=>g.t===c.dataset.t))});
$("q").addEventListener("input",renderLib);

   ${g.h==="—"?"":`<div class="sub">Save states</div><div class="states" style="--c1:${g.c1};--c2:${g.c2}">

  $("pPlay").onclick=()=>launch(g);

/* início simulado */
function launch(g,resume){
  const o=document.createElement("div");o.className="launch";
  o.innerHTML=`<div class="box">${cover(g)}<h3>${resume?"Carregando save de":"Iniciando"} ${g.t}</h3><div class="bar"><i></i></div><p>${SYS[g.s].core} · ${g.fmt}. No ROXemu de verdade o jogo abre aqui em tela cheia. Aperte B ou Esc para voltar.</p></div>`;
  o.onclick=()=>o.remove();$("app").appendChild(o);
}

/* modos */
function setMode(m){
  mode=m;const lib=m==="biblioteca";
  $("console").hidden=lib;$("library").hidden=!lib;
  $("mConsole").classList.toggle("on",!lib);$("mLib").classList.toggle("on",lib);
  if(lib)renderLib();else requestAnimationFrame(layout);
  try{history.replaceState(null,"","#"+m)}catch(e){}
}
$("mConsole").onclick=()=>setMode("console");
$("mLib").onclick=()=>setMode("biblioteca");

/* teclado e controle */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const ov=document.querySelector(".launch");
  if(ov){if(e.key==="Escape"||e.key==="Backspace")ov.remove();return}
  if(mode!=="console")return;
  if(e.key==="ArrowRight"){select(sel+1);e.preventDefault()}
  else if(e.key==="ArrowLeft"){select(sel-1);e.preventDefault()}
  else if(e.key==="Enter"){launch(list[sel]);e.preventDefault()}
  else if(e.key==="q"||e.key==="Q")setCat(cat-1);
  else if(e.key==="e"||e.key==="E")setCat(cat+1);
});
let prev=[];
function pad(){
  const gp=[...(navigator.getGamepads?.()||[])].find(Boolean);
  if(gp){
    const b=gp.buttons.map(x=>x.pressed),ax=gp.axes[0]||0;
    const hit=i=>b[i]&&!prev[i];
    const right=b[15]||ax>.6,left=b[14]||ax<-.6;
    const ov=document.querySelector(".launch");
    if(ov){if(hit(1))ov.remove()}
    else if(mode==="console"){
      if(right&&!prev.right)select(sel+1);
      if(left&&!prev.left)select(sel-1);
      if(hit(0))launch(list[sel]);
      if(hit(3))$("details").click();
      if(hit(1))$("fav").click();
    }
    if(hit(4))setCat(cat-1);if(hit(5))setCat(cat+1);
    prev=b;prev.right=right;prev.left=left;
  }
  requestAnimationFrame(pad);
}
requestAnimationFrame(pad);

/* relógio */
function clock(){$("clock").textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
clock();setInterval(clock,15000);

/* poeira de luz no fundo */
(function(){
  const c=$("dust"),x=c.getContext("2d");let W,H,P=[];
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){W=c.width=c.offsetWidth*devicePixelRatio;H=c.height=c.offsetHeight*devicePixelRatio;
    P=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.6+.4)*devicePixelRatio,v:(Math.random()*.25+.05)*devicePixelRatio,a:Math.random()*.5+.15,h:Math.random()<.5?"236,72,153":"167,139,250"}))}
  function draw(){x.clearRect(0,0,W,H);for(const p of P){x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(${p.h},${p.a})`;x.fill();if(!still){p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}}}if(!still)requestAnimationFrame(draw)}
  size();draw();addEventListener("resize",size);
})();

addEventListener("resize",()=>mode==="console"&&layout());
renderChips();buildStage();
setMode(location.hash==="#biblioteca"?"biblioteca":"console");
</script>
